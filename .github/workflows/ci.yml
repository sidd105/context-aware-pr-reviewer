name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The example runs fully offline (recorded AI responses, saved tool reports).
      - run: node dist/src/cli.js assess --repo examples/sample-service --env demo --fail-on never >> "$GITHUB_STEP_SUMMARY"
