# The Zen of Python (PEP 20) and a few PEP 8 basics, as checkable rules.
# Deterministic where the principle can be measured; agentic where it takes
# judgement. Organizations extend this and override thresholds, severities
# and enforcement in their own ruleset.
apiVersion: cqr/v1
kind: RuleSet
metadata:
  id: python-zen
  version: 1.0.0
  owner: cqr-maintainers
  source: industry
  description: PEP 20 principles and PEP 8 basics for Python code

defaults:
  enforcement: scored
  applies_to:
    languages: [python]
    exclude: ["**/migrations/**", "**/vendor/**"]

rules:
  - id: PY-ZEN-001
    title: Errors should never pass silently
    rationale: A swallowed exception turns a loud, debuggable failure into silent data corruption.
    category: reliability
    severity: high
    evaluator: python.ast
    params: { check: silent_except }
    remediation: Handle the exception, log it with context, or let it propagate. If ignoring is intended, catch the narrowest type and say why in a comment.

  - id: PY-ZEN-002
    title: No bare except clauses
    rationale: "`except:` also catches KeyboardInterrupt and SystemExit."
    category: reliability
    severity: medium
    evaluator: python.ast
    params: { check: bare_except }
    remediation: Catch a specific exception type, or `except Exception` at most.

  - id: PY-ZEN-003
    title: Flat is better than nested
    category: maintainability
    severity: medium
    evaluator: python.ast
    params: { check: nesting_depth, max: 4 }
    remediation: Return early, extract helper functions, or invert conditions.

  - id: PY-ZEN-004
    title: Simple is better than complex
    rationale: Cyclomatic complexity above 10 correlates with defects and makes functions hard to test.
    category: maintainability
    severity: medium
    evaluator: python.ast
    params: { check: complexity, max: 10 }
    remediation: Split the function along its decision points.

  - id: PY-ZEN-005
    title: Readability counts (functions fit on a screen)
    category: maintainability
    severity: low
    evaluator: python.ast
    params: { check: function_length, max: 60 }

  - id: PY-ZEN-006
    title: Explicit is better than implicit (no wildcard imports)
    category: code-quality
    severity: medium
    evaluator: python.ast
    params: { check: wildcard_import }
    remediation: Import the names you use.

  - id: PY-ZEN-007
    title: No mutable default arguments
    rationale: Default values are evaluated once, so a mutable default is shared between calls.
    category: reliability
    severity: high
    evaluator: python.ast
    params: { check: mutable_default }
    remediation: Default to None and create the object inside the function.

  - id: PY-ZEN-008
    title: Functions take few parameters
    category: maintainability
    severity: low
    evaluator: python.ast
    params: { check: max_params, max: 6 }

  - id: PY-ZEN-009
    title: Public functions are documented
    category: documentation
    severity: low
    enforcement: advisory
    evaluator: python.ast
    params: { check: missing_docstring, min_length: 5 }

  - id: PY-ZEN-010
    title: Avoid global state
    category: maintainability
    severity: low
    evaluator: python.ast
    params: { check: global_statement }

  - id: PY-SYNTAX-001
    title: Code parses
    category: reliability
    severity: critical
    enforcement: mandatory
    evaluator: python.ast
    params: { check: syntax_error }

  - id: PY-PEP8-E501
    title: Lines are at most 120 characters
    category: code-quality
    severity: low
    enforcement: advisory
    evaluator: metrics.line_length
    params: { max: 120 }

  # Principles that need judgement. These are agentic: they count for less in
  # the score and can't trip a gate unless the organization allows it.
  - id: PY-ZEN-011
    title: Names reveal intent
    description: Functions, variables and classes are named for what they mean in the domain, not for their type or a single letter. Short names are fine for tiny scopes such as loop indices.
    category: maintainability
    severity: low
    evaluator: ai.review
    ai: { complexity: low }
    examples:
      bad: ["def proc(d, x):\n    tmp = d[x]"]
      good: ["def settle_payment(ledger, payment_id):\n    entry = ledger[payment_id]"]

  - id: PY-ZEN-012
    title: There should be one obvious way to do it
    description: The same logic is not implemented twice in slightly different ways. Look for duplicated business logic, not boilerplate.
    category: maintainability
    severity: medium
    evaluator: ai.review
    ai: { complexity: medium }
